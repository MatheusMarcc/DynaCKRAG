# =====================================================================
#  dynacritic — configuração padrão para notebook com RTX 3050 4 GB
#  (DynaKRAG = laço A, controle de aquisição | RAG-Critic = laço B, reparo)
# =====================================================================

data:
  dir: data
  n_train: 300          # perguntas para rotular/treinar a RF (artigo: 1000)
  n_dev: 300            # perguntas de avaliação (artigo: split completo, 7405)
  seed: 13

retriever:
  kind: bm25            # bm25 = CPU, sem download | dense = sentence-transformers + FAISS
  dense_model: BAAI/bge-small-en-v1.5    # artigo: BAAI/bge-large-en-v1.5
  device: cpu           # deixe a GPU de 4 GB só para o LLM
  initial_depth: 50     # tamanho do ranking inicial (a "fronteira")
  docs_per_action: 3    # docs novos por ação de retrieval (artigo: 3)

llm:
  backend: ollama       # ollama | openai (vLLM, APIs compatíveis) | mock (testes)
  base_url: http://localhost:11434
  api_key: ""           # só para backend openai
  num_ctx: 8192         # IMPORTANTE: o padrão do Ollama é menor e trunca o prompt em silêncio
  seed: 13
  keep_alive: 30m
  think: null           # use false com modelos "thinking" (ex.: família Qwen3)
  cache_path: null      # padrão: <data.dir>/llm_cache.sqlite
  timeout_s: 600

models:
  generator: qwen2.5:3b                                   # cabe inteiro em 4 GB (Q4)
  critic: hf.co/mradermacher/RAG-Critic-3B-GGUF:Q4_K_M    # crítico oficial convertido p/ GGUF
  planner: qwen2.5:3b                                     # pode trocar por qwen2.5-coder:3b

loop:                   # laço A — DynaKRAG
  max_steps: 4          # passos de aquisição/controle (artigo: 4)
  max_retrievals: 4
  max_final_docs: 12    # docs máximos no contexto final (artigo: 12)
  policy: uniform       # uniform (ablação "sem controlador") | rf (controlador aprendido)
  rf_path: null         # padrão: <data.dir>/controller_rf.pkl
  stop_gate: sufficient_only   # regra de continuação: só para se a checagem disser "suficiente"
  compression: true
  compress_max_snippets: 8     # MuSiQue no artigo: 12
  compress_max_tokens: 256     # MuSiQue no artigo: 384
  answer_max_tokens: 48
  rf_trees: 300
  rf_min_leaf: 8

repair:                 # laço B — RAG-Critic
  mode: menu            # menu (JSON, bom p/ modelos pequenos) | code (fiel ao artigo) | state (integração nova)
  critic_top_k: 5       # o crítico foi treinado com top-5 passagens
  max_retrievals: 2     # orçamento de retrieval extra no reparo
  extra_steps: 2        # só no modo state: passos extras do laço A
